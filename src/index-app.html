<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>remons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            z-index: 9999;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1890ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="loader"></div>
    </div>
    <script src="utils/app-pages.js"></script>
    <script>
        // 所有可用页面列表 (构建时由 deploy-app.js 注入)
        var pagesList = __PAGES_JSON__;
        var LAST_PAGE_KEY = 'remons_last_page';
        var mainPage = 'note';

        window.getLastPage = function () {
            try {
                var raw = localStorage.getItem(LAST_PAGE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        };

        function initApp() {
            var lastPageData = window.getLastPage();
            if (lastPageData && lastPageData.pageName && lastPageData.pageName !== mainPage) {
                mainPage = lastPageData.pageName;
            }

            // 构建 URL，包含恢复参数
            var url = mainPage + '/index.html';
            if (lastPageData && lastPageData.params) {
                var search = new URLSearchParams(lastPageData.params);
                var suffix = search.toString();
                if (suffix) url += '?' + suffix;
            }

            var main = plus.webview.getWebviewById(mainPage);
            if (!main) {
                main = plus.webview.create(
                    url,
                    mainPage,
                    { top: '0px', bottom: '0px', width: '100%', height: '100%' }
                );
                main.show('auto', 0);
            }

            document.getElementById('loading').style.display = 'none';
        }

        if (typeof plus !== 'undefined' && plus.webview) {
            initApp();
        } else {
            document.addEventListener('plusready', initApp);
        }
    </script>
</body>

</html>
